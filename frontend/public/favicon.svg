<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="512" height="512">
  <!-- 
    The background is completely transparent. 
    The stroke color is set to #6366F1 (Electric Indigo) for perfect visibility on both light and dark themes. 
  -->
  <g fill="none" stroke="#6366F1" stroke-width="8" stroke-linecap="butt" stroke-linejoin="miter">
    <!-- Outer Circle -->
    <circle cx="50" cy="50" r="38" />
    
    <!-- Checkmark -->
    <polyline points="32,53 45,66 70,41" />
  </g>
</svg>